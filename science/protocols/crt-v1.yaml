protocol_id: ANIMUS-CRT-v1
version: 0.7.1
stage: 0I
status: draft
claim_ceiling: L1_BEHAVIORAL_ASSISTED
registered: false
registration_note: >-
  Stage 0G theory adjudication, trial-level model validation, and calibration planning only. No human
  data may be collected under this protocol until the preregistration is registered and ethics
  approval is documented.

construct:
  name: counterfactual_reality_testing
  provisional_name: prospective_reality_testing
  definition: >-
    The accuracy, calibration, and efficiency with which a person prospectively predicts the
    consequence of a source-diagnostic test and uses the observed outcome to revise a seen, imagined,
    described, or new attribution. The prediction is a belief-based readout and policy signal, not an
    independent source likelihood.
  not:
    - neural_decoding
    - diagnostic_classification
    - imagery_strength
    - composite_score
    - clinical_prediction
    - autobiographical_counterfactual_imagination

sources: [seen, imagined, described, new]

tests:
  - test_id: viewpoint
    name: Viewpoint shift
    likelihood_positive: {seen: 0.80, imagined: 0.40, described: 0.25, new: 0.20}
    cost: 1.5
    complexity: 2
    agency_value: 0.30
  - test_id: generation
    name: Generation check
    likelihood_positive: {seen: 0.30, imagined: 0.75, described: 0.55, new: 0.20}
    cost: 1.0
    complexity: 1
    agency_value: 0.40
  - test_id: context
    name: Context check
    likelihood_positive: {seen: 0.70, imagined: 0.65, described: 0.60, new: 0.20}
    cost: 1.0
    complexity: 1
    agency_value: 0.30
  - test_id: intend
    name: Intention check
    likelihood_positive: {seen: 0.20, imagined: 0.70, described: 0.25, new: 0.20}
    cost: 2.0
    complexity: 3
    agency_value: 0.70
  - test_id: description
    name: Description check
    likelihood_positive: {seen: 0.25, imagined: 0.50, described: 0.80, new: 0.20}
    cost: 1.0
    complexity: 1
    agency_value: 0.30
  - test_id: fluency
    name: Fluency check
    likelihood_positive: {seen: 0.55, imagined: 0.55, described: 0.55, new: 0.55}
    cost: 0.5
    complexity: 1
    agency_value: 0.30
    zero_diagnosticity_trap: true

design:
  task: prospective_counterfactual_prediction_with_source_judgment
  confidence_range: [0.05, 1.0]
  abstention_allowed: true
  main_n: 480
  analysed_n_at_10pct_attrition: 432
  sesoi_d: 0.20
  planned_power_at_sesoi: 0.925
  primary_endpoint: model_based_source_sensitivity
  secondary_endpoint: raw_source_accuracy
  calibration_n: 80
  calibration_status: protocol_only_human_data_gated
  theory_adjudication: signal_strength_vs_higher_order_precision_vs_active_prospective_inference
  model_space: [M0, M1, M2, M3, M4, M5, M6, M7]
  confirmatory_models: [M0, M2, M4, M6, M7]
  exploratory_models: [M1, M3, M5]
  design_optimization_status: required_before_registration
  design_optimization_objective: maximin_pairwise_model_discrimination_with_power_floor
  design_optimization_method: full_joint_model_bic_screen_then_target_scale_sbc
  adversarial_review_status: package_draft_not_yet_reviewed
  adversarial_bayesian_status: protocol_draft_not_yet_reviewed
  full_model_scope: full_joint_source_monitoring_latent_state_not_policy_pomdp
  policy_model_status: required_before_registration
  inference_backend: numpyro_nuts_with_laplace_screening_fallback
  identifiability_status: required_before_registration
  source_audit_status: required
  calibration_table_status: required_before_main
  neural_extension_status: optional_separate_stage_1e_not_required
  stage0h_status: historical_computational_only_human_data_gated
  stage0i_status: computational_only_human_data_gated
  trials_per_occasion: 120
  total_trials: 240
  observe_trials_per_occasion: 20
  cells:
    - active_intervene
    - active_predict
    - yoked_intervene
    - yoked_predict
  trials_per_cell_per_occasion: 25
  primary_contrast: yoked_predict_minus_yoked_intervene
  secondary_contrast: active_predict_minus_active_intervene
  primary_contrast_note: >-
    The yoked contrast fixes the test sequence, so it is the clean prediction anchor. The active
    contrast is a package effect of prediction plus self-selected testing and is secondary.
  session_cap_minutes: 75
  max_tests_per_trial: 2
  test_replacement: false
  budget_points: 80
  occasions_days: [0, 14]
  blocks: [observe, active_intervene, active_predict, yoked_intervene, yoked_predict]
  order: counterbalanced
  training_trials: 12
  meta_d_prime_min_trials: 200
  yoked:
    match: test_sequence_from_matched_donor_item_order_time_on_task
    fallback: stratified_random
    fallback_logged: true
  prediction:
    timing: before_outcome_reveal
    report_confidence: true
    prediction_is_not_a_source_judgment: true
    prediction_source: belief
    source_update: outcome_only
    prediction_format: single
    dual_hypothesis_format: available
    oracle_benchmark_only: true
    oracle_inflation_reporting_required: true

specificity_substudy:
  stage: 1C
  n: 160
  design: within_subject_fixed_sequence
  arms: [active_predict_diagnostic, active_predict_nondiagnostic]
  primary_outcome: source_accuracy
  controls: [fixed_test_sequence, prediction_format, confidence_report, cost, time]
  status: limited_after_stage0e
  note: >-
    The non-diagnostic prediction is source-neutral by construction. The Stage 0D diagnostic advantage
    did not reproduce under belief-based prediction (Stage 0E source accuracy gain 0.026; diagnostic
    prediction accuracy 0.505). A null or negative diagnostic contrast rejects the
    counterfactual-prediction interpretation.

dual_substudy:
  stage: 1D
  n: 160
  design: within_subject_fixed_sequence
  arms:
    - active_predict_single
    - active_predict_dual
    - active_predict_dual_nondiagnostic
  primary_outcome: false_seen_rate_for_imagined_items
  secondary_outcomes: [source_accuracy, source_confidence, criterion_bias]
  controls: [fixed_test_sequence, confidence_report, cost, time]
  status: human_test_pending_registration
  note: >-
    Tests whether dual counterfactual prediction improves discrimination or increases false seen
    attributions. A null or harmful result is informative and blocks a benefit claim.

selection_substudy:
  stage: 1B
  n: 160
  design: within_subject_randomized_blocks
  arms: [active_predict, random_passive, algorithm_adaptive]
  primary_contrast: active_minus_random_passive
  adaptive_design_contrast: algorithm_minus_random_passive
  note: >-
    Matched-sequence yoking cannot identify active-selection superiority. Algorithm-adaptive
    selection is a benchmark, not a failed control.

model:
  evidence_model: bayesian_source_posterior_with_forward_model
  evidence_gain: logit_scaled
  prediction_model: belief_posterior_predictive
  prediction_formula: "sigmoid(pi * logit(sum_s m_i(s) * p_as))"
  source_update: outcome_only
  oracle_benchmark: true
  oracle_benchmark_note: "Oracle prediction is retained only to quantify inflation; it is not a human model."
  dual_hypothesis_model: p_seen_and_p_imagined_readout
  policy: normalized_meta_expected_information_gain_minus_cost
  utility: "beta * (EIG_meta / max(EIG_meta) - lambda * cost - gamma * complexity) + alpha * agency"
  stopping: "softmax_includes_tau"
  source_choice: "MAP plus guess and externalization mixture"
  baselines: [greedy_meta_eig, random_meta_eig, greedy_eig, positive_testing, fixed, heuristic, random, cost_only]
  parameters: [d, pi, b_pi, beta, lambda, gamma, tau, guess, bias, mix, alpha, lapse]
  crte_meta:
    numerator: human_meta_eig_minus_random_meta_eig
    denominator: greedy_meta_eig_minus_random_meta_eig
    bounds: [0, 1]
    insufficient_tests: null
  crte_eig:
    numerator: human_eig_minus_random_eig
    denominator: greedy_eig_minus_random_eig
    bounds: [0, 1]
    insufficient_tests: null

estimands:
  primary:
    - prediction_advantage
    - specificity_advantage
    - crte_meta
    - prediction_ece
    - d_prime_seen_imagined
    - brier_score
  secondary:
    - active_calibration_advantage
    - active_accuracy_advantage
    - active_selection_advantage
    - crte_eig
    - criterion_c
    - externalization_rate
    - imagination_inflation_rate
    - confounded_test_rate
    - sampling_quality
    - termination_quality
    - number_of_tests
    - cost_sensitivity
    - mutual_information_test_source
    - meta_d_prime
    - prediction_accuracy_seen
    - prediction_accuracy_imagined
    - mean_counterfactual_discrepancy
    - mean_prediction_error
  forbidden:
    - composite_reality_score
    - diagnosis
    - imagery_strength
    - neural_content
    - clinical_prediction
    - priority_claim

reliability:
  model: ICC(2,1)
  target: 0.80
  lower_ci_target: 0.70
  individual_use_target: 0.90
  sem: true
  mdc95: true
  occasion_pair_days: [0, 14]

validation:
  framework: COSMIN
  content_validity_n: 24
  target_n: 240
  pilot_n: 40
  strata:
    aphantasia_or_hypophantasia: 80
    typical: 80
    hyperphantasia: 80
  convergent: [sim_d_prime, sim_meta_d_prime, vviq2, siaq]
  discriminant: [beads_draws, working_memory]
  invariance:
    delta_cfi_max: 0.01
    delta_rmsea_max: 0.015

gates:
  feasibility:
    completion_min: 0.80
    comprehension_min: 0.90
    serious_adverse_events_max: 0
  reliability:
    icc_min: 0.80
    lower_ci_min: 0.70
  prediction:
    advantage_min: 0.03
    crte_meta_min: 0.30
    prediction_ece_max: 0.15
    fluency_choice_max: 0.10
  specificity:
    status: limited_after_stage0e
    diagnostic_accuracy_gain_min: 0.02
    diagnostic_prediction_accuracy_min: 0.55
    fixed_sequence_required: true
    historical_oracle_artifact: results/crt/CRT_STAGE0D_SPECIFICITY_POWER.json
    belief_audit_artifact: results/crt/CRT_STAGE0E_SPECIFICITY_AUDIT.json
  active_selection:
    status: exploratory
    stage: 1B
    matched_yoking_cannot_identify_superiority: true
    random_passive_control_required_for_superiority: true
    algorithm_adaptive_benchmark: true
  policy:
    status: limited_after_stage0e
    out_of_sample_advantage_required: true
    cost_only_baseline_required: true
  counterfactual:
    status: limited_after_stage0e
    dual_prediction_advantage_required: true
    provisional_fallback_name: prospective_reality_testing
  incremental_validity:
    required: true
  discriminant:
    beads_r_max: 0.70
  training:
    blocked_until_measurement_pass: true
  clinical:
    blocked: true

boundaries:
  clinical_sample: false
  neural_data: false
  diagnosis: false
  llm_in_loop: false
  external_api: false
  priority_claim: false
  revolutionary_language: false

stage0c:
  simulation_artifact: results/crt/CRT_STAGE0_SIMULATION.json
  power_artifact: results/crt/CRT_STAGE0_POWER.json
  recovery_artifact: results/crt/CRT_MODEL_RECOVERY.json
  note: >-
    Simulation-only design gates. A PASS or REVIEW does not validate the task in humans and does not
    authorize a measurement claim.

stage0d:
  theory_artifact: results/crt/CRT_STAGE0D_MODEL_TOURNAMENT.json
  specificity_artifact: results/crt/CRT_STAGE0D_SPECIFICITY_POWER.json
  gtheory_artifact: results/crt/CRT_STAGE0D_GTHEORY.json
  calibration_artifact: results/crt/CRT_STAGE0D_CALIBRATION.json
  status: historical_oracle_path
  note: >-
    Simulation-only theory and design controls. The specificity result was generated with oracle
    prediction and prediction/outcome double counting; it is retained as historical evidence only.

stage0e:
  model_repair_artifact: results/crt/CRT_STAGE0E_MODEL_REPAIR.json
  specificity_audit_artifact: results/crt/CRT_STAGE0E_SPECIFICITY_AUDIT.json
  counterfactual_artifact: results/crt/CRT_STAGE0E_COUNTERFACTUAL.json
  policy_artifact: results/crt/CRT_STAGE0E_POLICY.json
  psychometric_artifact: results/crt/CRT_STAGE0E_PSYCHOMETRIC.json
  recovery_artifact: results/crt/CRT_STAGE0E_RECOVERY.json
  model_repair_gate: ANIMUS_P5_CRT_MODEL_REPAIR
  recovery_gate: ANIMUS_P5_CRT_RECOVERY_BELIEF
  counterfactual_gate: ANIMUS_P5_CRT_COUNTERFACTUAL
  policy_gate: ANIMUS_P5_CRT_POLICY
  psychometric_gate: ANIMUS_P5_CRT_PSYCHOMETRIC
  note: >-
    Belief-based prediction with outcome-only source updating. Oracle inflation 0.101. Specificity,
    dual-prediction, and policy claims are LIMITED; psychometric facets, model repair, and conditional
    belief-readout recovery pass in simulation. The recovery check fixes d, guessing, and response
    bias and is not the full trial-level CRT hierarchical SBC. No human study is authorized by these
    results.

stage0f:
  protocol_audit_artifact: results/crt/CRT_STAGE0F_PROTOCOL_AUDIT.json
  design_power_artifact: results/crt/CRT_STAGE0F_DESIGN_POWER.json
  distortion_artifact: results/crt/CRT_STAGE0F_DISTORTION.json
  hierarchical_screening_artifact: results/crt/CRT_STAGE0F_HIERARCHICAL_SCREENING.json
  hierarchical_sbc_artifact: results/crt/CRT_STAGE0F_HIERARCHICAL_SBC.json
  model_recovery_artifact: results/crt/CRT_STAGE0F_MODEL_RECOVERY.json
  registration_artifact: results/crt/CRT_STAGE0F_REGISTRATION_PACKAGE.json
  protocol_gate: ANIMUS_P5_CRT_PROTOCOL_INTEGRITY
  design_power_gate: ANIMUS_P5_CRT_DESIGN_POWER
  distortion_gate: ANIMUS_P5_CRT_DISTORTION_ASSAY
  hierarchical_screening_gate: ANIMUS_P5_CRT_HIERARCHICAL_SCREENING
  hierarchical_sbc_gate: ANIMUS_P5_CRT_HIERARCHICAL_SBC
  model_recovery_gate: ANIMUS_P5_CRT_MODEL_RECOVERY_DUAL
  registration_gate: ANIMUS_P5_CRT_REGISTRATION_READY
  status: blocked
  note: >-
    Stage 0F repairs trial arithmetic and the primary-contrast confound, checks design power and the
    dual-prediction distortion assay, and adds endpoint-level hierarchical SBC and M0/M2/M3/M4
    recovery. Registration remains BLOCKED on design power; a trial-level CRT hierarchical SBC is
    still outstanding. No human data collection is authorized.
