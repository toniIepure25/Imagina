version: 1
description: Gate definitions. A gate status is always derived from its canonical artifact.

gates:
  - gate_id: C1
    name: Neural-behavioural alignment
    canonical_artifact: c1.final
    claim_ids: []
    note: "Null on incremental validity; mechanism unresolved."

  - gate_id: C2
    name: Neural content and state disentanglement
    canonical_artifact: c2.final
    claim_ids: []
    note: "Null content and transfer within sensitivity."

  - gate_id: C3
    name: Zero-shot imagery transfer
    canonical_artifact: c3.final
    claim_ids: [claim.imagery_neural_content]
    note: "Perception passes; imagery transfer null."

  - gate_id: C3M
    name: Cross-session alignment mechanism
    canonical_artifact: c3m.final
    claim_ids: [claim.imagery_neural_content]
    note: "Alignment works for seen images; imagery remains degenerate."

  - gate_id: C3XAT_R1
    name: Atlas imagery qualification (replication 1)
    canonical_artifact: c3xat.r1.final
    claim_ids: [claim.scene_reconstruction_accuracy, claim.imagery_neural_content, claim.neural_geometry]
    note: "1/6 subject pass; C3XAG not authorized."

  - gate_id: ANIMUS_P1
    name: ANIMUS closed-loop vertical slice
    canonical_artifact: animus.p1
    claim_ids: [claim.behavioral_imagery_assistance]
    note: "Engineering pass under simulation; not a human validation."

  - gate_id: ANIMUS_P2
    name: Perception decoder confirmation
    canonical_artifact: animus.p2r
    claim_ids: [claim.perception_neural_content]
    note: "Confirmatory compute blocked; pilot only."

  - gate_id: ANIMUS_P3_SIM
    name: Source-monitoring Stage 0 simulation
    canonical_artifact: animus.p3.sim
    claim_ids: []
    note: >-
      Simulation-only design gate for the Source and Imagination Monitor. A PASS means parameter
      recovery and the coverage constraints are acceptable in simulation; it is not human
      validation and does not authorize a measurement claim.

  - gate_id: ANIMUS_P3_POWER
    name: Source-monitoring Stage 1 power check
    canonical_artifact: animus.p3.power
    claim_ids: []
    note: >-
      Simulation-only planning gate. A PASS means the planned N=180 has at least 80% power for the
      reliability lower-bound target under the stated approximation; it is not human evidence.

  - gate_id: ANIMUS_P4_ART_SIM
    name: Active Reality Testing Stage 0B simulation
    canonical_artifact: animus.p4.art.sim
    claim_ids: []
    note: >-
      Simulation-only design gate. A PASS means the EIG agent is above chance and its query choices
      are efficient under the stated model; it is not human validation and does not authorize a
      measurement claim.

  - gate_id: ANIMUS_P4_ART_POWER
    name: Active Reality Testing Stage 2 power check
    canonical_artifact: animus.p4.art.power
    claim_ids: []
    note: >-
      Simulation-only planning gate. A PASS means N=180 has at least 80% power for the ARTE
      reliability lower-bound target under the stated approximation; it is not human evidence.

  - gate_id: ANIMUS_P4_ART_RECOVERY
    name: Active Reality Testing policy recovery
    canonical_artifact: animus.p4.art.recovery
    claim_ids: []
    note: >-
      Simulation-only model-recovery gate. A PASS means the policy parameters are recovered within
      the stated tolerance conditional on the known EIG feature matrix; it does not validate the
      task or the full hierarchical measurement model.

  - gate_id: ANIMUS_P5_CRT_SIM
    name: Counterfactual Reality Testing Stage 0C simulation
    canonical_artifact: animus.p5.crt.sim
    claim_ids: []
    note: >-
      Simulation-only design gate. A PASS means the prospective-prediction contrast and the meta-EIG
      policy clear the stated thresholds in simulation; it is not human validation and does not
      authorize a measurement claim. A REVIEW preserves the prediction contrast as provisional and
      blocks the active-selection claim.

  - gate_id: ANIMUS_P5_CRT_RECOVERY
    name: Counterfactual Reality Testing policy and precision recovery
    canonical_artifact: animus.p5.crt.recovery
    claim_ids: []
    note: >-
      Simulation-only recovery gate. A PASS means policy, prediction-precision, and
      imagination-inflation parameters are recovered within the stated tolerance under the Stage 0C
      fixed-parameter conditions; it does not validate the task or the human analysis model.

  - gate_id: ANIMUS_P5_CRT_POWER
    name: Counterfactual Reality Testing Stage 1 power check
    canonical_artifact: animus.p5.crt.power
    claim_ids: []
    note: >-
      Simulation-only planning gate. A PASS means N=180 has at least 80% power for the reliability
      lower-bound target under the stated approximation; it is not human evidence.

  - gate_id: ANIMUS_P5_CRT_THEORY
    name: Counterfactual Reality Testing Stage 0D model-signature separability
    canonical_artifact: animus.p5.crt.theory
    claim_ids: []
    note: >-
      Simulation-only design-identifiability gate. A PASS means the five competing theory signatures
      are separable under the stated measurement noise. It is not a fit to human data and does not
      establish that any model is true.

  - gate_id: ANIMUS_P5_CRT_SPECIFICITY
    name: Counterfactual Reality Testing specificity and active-selection controls
    canonical_artifact: animus.p5.crt.specificity.belief
    claim_ids: []
    note: >-
      Simulation-only control gate, now canonicalized on belief-based prediction. The historical
      oracle artifact is preserved but superseded; Stage 0E showed that the diagnostic-specificity
      advantage did not reproduce when the participant predicted from the current source posterior.
      The current status is LIMITED. Not human evidence.

  - gate_id: ANIMUS_P5_CRT_MODEL_REPAIR
    name: Counterfactual Reality Testing belief-based prediction repair
    canonical_artifact: animus.p5.crt.model_repair
    claim_ids: []
    note: >-
      Simulation-only model-repair gate. A PASS means oracle inflation is quantified, the belief arm
      predicts from the current source posterior, the source is updated from the outcome only, and
      the nested posterior PIT calibration check passes. A PASS is design evidence, not human
      validation and not authorization for a measurement claim.

  - gate_id: ANIMUS_P5_CRT_RECOVERY_BELIEF
    name: Counterfactual Reality Testing belief-readout recovery and conditional SBC
    canonical_artifact: animus.p5.crt.recovery.belief
    claim_ids: []
    note: >-
      Simulation-only identifiability gate for the repaired belief readout. A PASS requires
      conditional parameter recovery of pi (relative RMSE, bias, correlation), a uniform conditional
      SBC rank histogram, and above-threshold recovery of M0 versus M2. d, guessing, and response bias
      are fixed; this is not full hierarchical SBC and not human evidence.

  - gate_id: ANIMUS_P5_CRT_COUNTERFACTUAL
    name: Counterfactual Reality Testing dual-hypothesis prediction
    canonical_artifact: animus.p5.crt.counterfactual
    claim_ids: []
    note: >-
      Simulation-only construct gate. A PASS requires dual diagnostic prediction to improve accuracy
      over a single prediction and a dual non-diagnostic prediction on the same test sequence. A
      REVIEW means the counterfactual label is not yet earned; the construct remains prospective
      reality testing.

  - gate_id: ANIMUS_P5_CRT_POLICY
    name: Counterfactual Reality Testing policy competition
    canonical_artifact: animus.p5.crt.policy
    claim_ids: []
    note: >-
      Simulation-only policy gate. A PASS requires meta-EIG selection to exceed both cost-only and
      the best competing policy. A REVIEW means the normative meta-EIG claim is descriptive only.

  - gate_id: ANIMUS_P5_CRT_PSYCHOMETRIC
    name: Counterfactual Reality Testing test-facet reliability
    canonical_artifact: animus.p5.crt.psychometric
    claim_ids: []
    note: >-
      Simulation-only test-facet reliability gate. A PASS means every simulated test facet clears
      the pre-specified relative-reliability floor at two occasions. It is not a human reliability
      estimate.

  - gate_id: ANIMUS_P5_CRT_GTHEORY
    name: Counterfactual Reality Testing generalizability decision study
    canonical_artifact: animus.p5.crt.gtheory
    claim_ids: []
    note: >-
      Simulation-only variance-component and decision-study gate. A PASS means the simulated
      person variance supports the stated relative-reliability target at two occasions; it is not an
      estimate of human reliability.

  - gate_id: ANIMUS_P5_CRT_CALIBRATION
    name: Counterfactual Reality Testing test-likelihood calibration design
    canonical_artifact: animus.p5.crt.calibration
    claim_ids: []
    note: >-
      Simulation-only calibration gate. A PASS means at least four tests have a strong simulated
      seen-versus-imagined likelihood ratio and the fluency trap remains non-diagnostic. A human
      calibration sample must freeze the likelihood table before confirmatory data collection.

  - gate_id: ANIMUS_P5_CRT_PROTOCOL_INTEGRITY
    name: Counterfactual Reality Testing Stage 0F protocol integrity
    canonical_artifact: animus.p5.crt.protocol_audit
    claim_ids: []
    note: >-
      Design-integrity gate for the Stage 0F protocol. A PASS requires consistent trial arithmetic,
      a yoked primary prediction contrast, a labelled active package contrast, six tests, the fluency
      trap, and a session duration within the 75-minute cap. It does not authorize human collection.

  - gate_id: ANIMUS_P5_CRT_DESIGN_POWER
    name: Counterfactual Reality Testing Stage 0F design power
    canonical_artifact: animus.p5.crt.design_power
    claim_ids: []
    note: >-
      Simulation-only planning gate. A PASS requires at least 90% power for the stated smallest effect
      of interest, 80% for the false-seen distortion assay, and 80% for the reliability lower bound.
      A REVIEW means the current N/trial design is not adequately powered and must not be registered
      as confirmatory.

  - gate_id: ANIMUS_P5_CRT_DISTORTION_ASSAY
    name: Counterfactual Reality Testing Stage 0F distortion assay
    canonical_artifact: animus.p5.crt.distortion
    claim_ids: []
    note: >-
      Simulation-only assay-validation gate. A PASS means the paired false-seen assay detects an
      injected 5-percentage-point shift with at least 80% power while the b_pi=0 readout-only model
      remains null. A separate b_pi>0 run illustrates a model-predicted bias channel. It does not show
      that dual prediction causes distortion in humans.

  - gate_id: ANIMUS_P5_CRT_HIERARCHICAL_SCREENING
    name: Counterfactual Reality Testing Stage 0F hierarchical recovery screening
    canonical_artifact: animus.p5.crt.hierarchical_screening
    claim_ids: []
    note: >-
      Conditional group-mean screening with participant-level pi variation. A PASS is screening
      evidence only; it is not joint hierarchical SBC and does not recover M3/M4. The endpoint-level
      hierarchical SBC is reported separately; the trial-level CRT model remains outstanding.

  - gate_id: ANIMUS_P5_CRT_HIERARCHICAL_SBC
    name: Counterfactual Reality Testing Stage 0F endpoint hierarchical SBC
    canonical_artifact: animus.p5.crt.hierarchical_sbc
    claim_ids: []
    note: >-
      Full hierarchical Bayes for the Stage 1D paired false-seen endpoint (group means, between-person
      SD, participant-level differences, known binomial SEs), with 1,000 prior draws. A PASS means the
      endpoint rank histogram is calibrated and 95% coverage is in range. It is not a trial-level CRT
      source-monitoring SBC.

  - gate_id: ANIMUS_P5_CRT_MODEL_RECOVERY_DUAL
    name: Counterfactual Reality Testing Stage 0F endpoint model recovery
    canonical_artifact: animus.p5.crt.model_recovery
    claim_ids: []
    note: >-
      Hierarchical endpoint recovery among four parameterizations: no format effect (M0), common
      format effect (M2), dual-specific effect (M3), and dual plus nondiagnostic-demand effect (M4).
      A PASS requires balanced accuracy >=0.85. These are endpoint models, not the Stage 0D theory
      models.

  - gate_id: ANIMUS_P5_CRT_STAGE0G_DESIGN_POWER
    name: Counterfactual Reality Testing Stage 0G design power
    canonical_artifact: animus.p5.crt.stage0g_design_power
    claim_ids: []
    note: >-
      Planning approximation at N=480 and d=0.20. A PASS requires at least 90% power for the primary
      yoked contrast. It is not trial-level model power and is not human evidence.

  - gate_id: ANIMUS_P5_CRT_TRIAL_SBC
    name: Counterfactual Reality Testing Stage 0G trial-level SBC
    canonical_artifact: animus.p5.crt.trial_sbc
    claim_ids: []
    note: >-
      Trial-level hierarchical readout SBC with participant random effects and condition effects. A PASS
      means the target condition-effect ranks/coverage are calibrated for the readout model. It is not
      the full CRT source-monitoring POMDP and does not authorize human collection.

  - gate_id: ANIMUS_P5_CRT_TRIAL_RECOVERY
    name: Counterfactual Reality Testing Stage 0G trial-level model recovery
    canonical_artifact: animus.p5.crt.trial_recovery
    claim_ids: []
    note: >-
      BIC-based effect-conditioned recovery among the confirmatory M0/M2/M4 readout models; M1/M3/M5 are
      exploratory. A PASS requires balanced accuracy >=0.85. It validates the readout model family, not
      the full CRT theory tournament.

  - gate_id: ANIMUS_P5_CRT_STAGE0H_MODEL_SPACE
    name: Counterfactual Reality Testing Stage 0H model space
    canonical_artifact: animus.p5.crt.stage0h_model_space
    claim_ids: []
    note: >-
      Declares M0-M7 and the confirmatory M0/M2/M4/M6/M7 set. A PASS means the model space and
      exploratory labels are explicit; it is not evidence for any model.

  - gate_id: ANIMUS_P5_CRT_STAGE0H_DESIGN_OPTIMIZATION
    name: Counterfactual Reality Testing Stage 0H design optimization
    canonical_artifact: animus.p5.crt.stage0h_design_optimization
    claim_ids: []
    note: >-
      Offline screening of trial compositions for model discrimination under a power floor. A PASS
      means a candidate reaches the discrimination and power thresholds; it is not human evidence and
      the classifier used to rank candidates is not a hypothesis test.

  - gate_id: ANIMUS_P5_CRT_STAGE0H_FULL_MODEL_SBC
    name: Counterfactual Reality Testing Stage 0H full-model SBC
    canonical_artifact: animus.p5.crt.stage0h_full_model_sbc
    claim_ids: []
    note: >-
      Full joint latent-source SBC with observed test choice. A PASS means the declared target
      parameters are calibrated for this likelihood; it is not the policy POMDP or human evidence.

  - gate_id: ANIMUS_P5_CRT_STAGE0H_FULL_MODEL_RECOVERY
    name: Counterfactual Reality Testing Stage 0H full-model recovery
    canonical_artifact: animus.p5.crt.stage0h_full_model_recovery
    claim_ids: []
    note: >-
      BIC recovery among the pre-specified full joint models. A PASS requires balanced accuracy >=0.85
      under the recorded simulation conditions; it is identifiability evidence only.

  - gate_id: ANIMUS_P5_CRT_STAGE0H_READINESS
    name: Counterfactual Reality Testing Stage 0H readiness
    canonical_artifact: animus.p5.crt.stage0h_package
    claim_ids: []
    note: >-
      Documentation-quality gate. BLOCKED is expected until computational gates, adversarial review,
      calibration, registration, and ethics are complete. It never authorizes human collection.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_SOURCE_INTEGRITY
    name: Counterfactual Reality Testing Stage 0I source integrity
    canonical_artifact: animus.p5.crt.stage0i_source_integrity
    claim_ids: []
    note: >-
      Source metadata and correction audit. A PASS means the cited DOI/PMID records and the Corcoran
      role correction were checked; it is not a systematic review.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_INFERENCE_BACKEND
    name: Counterfactual Reality Testing Stage 0I inference backend
    canonical_artifact: animus.p5.crt.stage0i_inference_backend
    claim_ids: []
    note: >-
      Optional NumPyro/JAX readiness. BLOCKED means confirmatory posterior inference is not installed;
      Laplace remains approximate and cannot pass a confirmatory gate.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_IDENTIFIABILITY
    name: Counterfactual Reality Testing Stage 0I identifiability
    canonical_artifact: animus.p5.crt.stage0i_identifiability
    claim_ids: []
    note: >-
      Simulation-only pairwise full-model recovery. A PASS requires all confirmatory models and lower
      uncertainty bounds above threshold; it is not human evidence.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_DESIGN_ADO
    name: Counterfactual Reality Testing Stage 0I design optimization
    canonical_artifact: animus.p5.crt.stage0i_design_ado
    claim_ids: []
    note: >-
      Full-joint-model design screen. A PASS requires the complete confirmatory set and minimum pairwise
      recovery above threshold; it is design evidence, not a hypothesis test.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_TARGET_DESIGN_READOUT
    name: Counterfactual Reality Testing Stage 0I target readout design
    canonical_artifact: animus.p5.crt.stage0i_target_design_readout
    claim_ids: []
    note: >-
      N=432/T=240 single-replicate hierarchical readout screen with the combined manipulation. It is
      not a full joint-model fit, SBC, or human evidence, so both PASS and REVIEW map to LIMITED.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_TARGET_DESIGN_PROJECTION
    name: Counterfactual Reality Testing Stage 0I target design projection
    canonical_artifact: animus.p5.crt.stage0i_target_design_projection
    claim_ids: []
    note: >-
      Pilot full-model BIC separation projected to N=432/T=240 by a normal approximation. It is a
      planning projection, not a target-scale fit, target-scale SBC, or human evidence.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_POLICY_SBC
    name: Counterfactual Reality Testing Stage 0I policy calibration
    canonical_artifact: animus.p5.crt.stage0i_policy_sbc
    claim_ids: []
    note: >-
      Discrete policy-model calibration, not continuous-parameter SBC. It does not show that humans use
      the policy.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_POLICY_PARAMETER_SBC
    name: Counterfactual Reality Testing Stage 0I policy parameter SBC
    canonical_artifact: animus.p5.crt.stage0i_policy_parameter_sbc
    claim_ids: []
    note: >-
      Laplace approximate SBC for meta-EIG policy parameters. It is not NUTS and does not establish
      that participants use the policy.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_FULL_MODEL_SBC
    name: Counterfactual Reality Testing Stage 0I full-model SBC
    canonical_artifact: animus.p5.crt.stage0i_full_model_sbc
    claim_ids: []
    note: >-
      Laplace SBC for all confirmatory latent-source models. A PASS is screening calibration, not NUTS.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_FULL_MODEL_RECOVERY
    name: Counterfactual Reality Testing Stage 0I full-model recovery
    canonical_artifact: animus.p5.crt.stage0i_full_model_recovery
    claim_ids: []
    note: >-
      BIC recovery across all confirmatory latent-source models. A PASS is simulation identifiability,
      not human evidence.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_POLICY_RECOVERY
    name: Counterfactual Reality Testing Stage 0I policy recovery
    canonical_artifact: animus.p5.crt.stage0i_policy_recovery
    claim_ids: []
    note: >-
      Policy-choice recovery in simulation. A PASS is policy identifiability, not human evidence.

  - gate_id: ANIMUS_P5_CRT_STAGE0I_READINESS
    name: Counterfactual Reality Testing Stage 0I readiness
    canonical_artifact: animus.p5.crt.stage0i_package
    claim_ids: []
    note: >-
      Documentation-quality readiness gate. BLOCKED is expected until computational gates, independent
      review, adversarial agreement, calibration, registration, and ethics are complete.

  - gate_id: ANIMUS_P5_CRT_REGISTRATION_READY
    name: Counterfactual Reality Testing registration readiness
    canonical_artifact: animus.p5.crt.registration_package
    claim_ids: []
    note: >-
      Documentation-quality gate. READY_FOR_INDEPENDENT_REVIEW means the Stage 0F package is complete
      enough for PI, statistician, adversarial, and ethics review; it does not authorize human data
      collection or upgrade any claim. BLOCKED means at least one prerequisite is missing. Endpoint
      SBC is complete and a trial-level readout SBC is reported, but trial-level readout recovery is a
      post hoc conditional pass (LIMITED), not a pre-specified full-set pass; the full CRT POMDP SBC,
      calibration, model-based power, independent review, and ethics remain blockers.

  - gate_id: ANIMUS_P5_CRT_STAGE0J_TARGET_SCALE
    name: Counterfactual Reality Testing target-scale readiness
    canonical_artifact: animus.p5.crt.stage0j_target_scale
    claim_ids: []
    note: >-
      NUTS SBC per confirmatory model plus BIC recovery and an explicit readiness decision. PASS is
      simulation-only and does not authorize human collection, a measurement claim, or a claim upgrade.
      BLOCKED is expected when the publication-grade posterior backend is unavailable.
