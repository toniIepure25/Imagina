[project]
name = "imagina-backend"
version = "0.5.0.dev1"
description = "IMAGINA — Closed-loop mental imagery training research platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "websockets>=12.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]
lsl = [
    "pylsl>=1.16",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"app/cli/openmiir_subject_normalized_benchmark.py" = ["E701", "E702", "E722", "N806", "N803", "E501", "F841"]
"app/cli/openmiir_subject_generalization_profile.py" = ["E701", "E702", "N806"]
