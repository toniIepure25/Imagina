          app/tests/test_objective_replay.py
          app/tests/test_objective_export.py
          app/tests/test_objective_provenance.py
          -v --timeout=120

  science-contrast-invariants:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Known-means contrast recovery
        run: >-
          python3 -m pytest
          app/tests/test_statistics.py::TestContrastRecovery
          -v --timeout=60

  science-calibrated-inference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Medium-effect oracle coverage and calibration
        run: >-
          python3 -m pytest
          app/tests/test_design_simulation.py
          -v --timeout=300

  science-objective-db-transaction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Schema migration and persistent objective execution
        run: >-
          python3 -m pytest
          app/tests/test_migration_runner.py
          app/tests/test_objective_runtime.py
          app/tests/test_objective_runtime_integration.py
          -v --timeout=120

  science-api-restart-recovery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Science worker claim and restart recovery
        run: >-
          python3 -m pytest
          app/tests/test_science_worker.py
          -v --timeout=120

  science-worker-resume-abort:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Worker resume, abort, and lease protection
        run: >-
          python3 -m pytest
          app/tests/test_science_worker.py
          -k "resume or abort or checkpoint or lease or overlapping or expired"
          -v --timeout=180

  science-api-cooperative-abort:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: API-driven cooperative abort through the real worker contract
        run: >-
          python3 -m pytest
          app/tests/test_science_api_abort.py
          -v --timeout=180

