name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Ruff lint
        run: python3 -m ruff check .
      - name: Core and research tests (hermetic merge-gate suite)
        run: >-
          python3 -m pytest app/tests/
          -m "core or research"
          --strict-markers
          --timeout=300
          -q

  backend-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Runtime tests
        run: >-
          python3 -m pytest
          app/tests/test_migration_runner.py
          app/tests/test_state_machines.py
          app/tests/test_runtime.py
          app/tests/test_outbox.py
          app/tests/test_manifest.py
          app/tests/test_synthetic_orchestrator.py
          app/tests/test_export_service.py
          app/tests/test_replay_validator.py
          app/tests/test_run_service.py
          app/tests/test_unified_db_integration.py
          app/tests/test_abort.py
          app/tests/test_regression_gate_a.py
          -v --timeout=300

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  playwright:
    runs-on: ubuntu-latest
    needs: [backend-core, backend-runtime, frontend, science-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -e ".[dev,science]"
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend
      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev compose
        run: docker compose config --quiet
      - name: Validate release compose
        run: docker compose -f docker-compose.release.yml config --quiet

  docker-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start services
        run: docker compose up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          docker compose logs backend
          exit 1
      - name: Run synthetic workflow smoke
        run: |
          set -euo pipefail

          STUDY_ID="docker-smoke-$(date +%s)"
          IDEM_KEY="docker-smoke-key-$(date +%s)"

          echo "=== Creating synthetic run ==="
          CREATE=$(curl -sf -X POST http://localhost:8000/api/synthetic-runtime/studies \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: $IDEM_KEY" \
            -d "{\"study_id\": \"$STUDY_ID\", \"participant_count\": 2, \"seed\": 42, \"trials_per_session\": 2, \"windows_per_trial\": 2}")
          RUN_ID=$(echo "$CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin)['run_id'])")
          echo "Run ID: $RUN_ID"

          echo "=== Polling for completion ==="
          for i in $(seq 1 90); do
            STATUS=$(curl -sf http://localhost:8000/api/synthetic-runtime/runs/$RUN_ID \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "  Poll $i: status=$STATUS"
            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "completed_with_failures" ]; then
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "Run failed!"
              exit 1
            fi
            sleep 2
          done

          if [ "$STATUS" != "completed" ]; then
            echo "Run did not complete: $STATUS"
            exit 1
          fi

          echo "=== Verifying sessions ==="
          SESSIONS=$(curl -sf http://localhost:8000/api/synthetic-runtime/runs/$RUN_ID/sessions)
          SESSION_COUNT=$(echo "$SESSIONS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Session count: $SESSION_COUNT"
          if [ "$SESSION_COUNT" -lt 6 ]; then
            echo "Expected at least 6 sessions, got $SESSION_COUNT"
            exit 1
          fi

          echo "=== Requesting export ==="
          EXPORT=$(curl -sf -X POST "http://localhost:8000/api/synthetic-runtime/runs/$RUN_ID/export?allow_overwrite=true")
          VALID=$(echo "$EXPORT" | python3 -c "import sys,json; print(json.load(sys.stdin)['validation']['valid'])")
          if [ "$VALID" != "True" ]; then
            echo "Export validation failed!"
            exit 1
          fi
          echo "Export valid: $VALID"

          echo "=== Checking export_ready ==="
          RUN_STATUS=$(curl -sf http://localhost:8000/api/synthetic-runtime/runs/$RUN_ID)
          EXPORT_READY=$(echo "$RUN_STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin)['export_ready'])")
          if [ "$EXPORT_READY" != "True" ]; then
            echo "export_ready is not True: $EXPORT_READY"
            exit 1
          fi
          echo "export_ready confirmed: $EXPORT_READY"

          echo "=== Running replay for one session ==="
          SESSION_ID=$(echo "$SESSIONS" | python3 -c "import sys,json; ss=json.load(sys.stdin); print([s['research_session_id'] for s in ss if s['status']=='completed'][0])")
          echo "Replaying session: $SESSION_ID"
          REPLAY=$(curl -sf -X POST "http://localhost:8000/api/synthetic-runtime/runs/$RUN_ID/replay/$SESSION_ID")
          MATCH=$(echo "$REPLAY" | python3 -c "import sys,json; print(json.load(sys.stdin)['match'])")
          if [ "$MATCH" != "True" ]; then
            echo "Replay match failed!"
            echo "$REPLAY"
            exit 1
          fi
          ORIG_HASH=$(echo "$REPLAY" | python3 -c "import sys,json; print(json.load(sys.stdin)['original_hash'])")
          REPLAY_HASH=$(echo "$REPLAY" | python3 -c "import sys,json; print(json.load(sys.stdin)['replay_hash'])")
          if [ "$ORIG_HASH" != "$REPLAY_HASH" ]; then
            echo "Hash mismatch: original=$ORIG_HASH replay=$REPLAY_HASH"
            exit 1
          fi
          echo "Replay hashes match: $ORIG_HASH"

          echo "=== Docker smoke completed successfully ==="
      - name: Cleanup
        if: always()
        run: docker compose down -v

  science-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: RNG and determinism tests
        run: >-
          python3 -m pytest
          app/tests/test_rng_registry.py
          -v --timeout=60
      - name: Objective measurement tests
        run: >-
          python3 -m pytest
          app/tests/test_objective_endpoints.py
          app/tests/test_psychophysics.py
          app/tests/test_calibration.py
          app/tests/test_objective_runtime.py
          app/tests/test_objective_runtime_integration.py
          app/tests/test_objective_provenance.py
          app/tests/test_objective_replay.py
          app/tests/test_objective_export.py
          -v --timeout=120
      - name: Crossover design tests
        run: >-
          python3 -m pytest
          app/tests/test_crossover_design.py
          -v --timeout=60

  science-statistics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Statistics and analysis tests
        run: >-
          python3 -m pytest
          app/tests/test_statistics.py
          app/tests/test_estimands.py
          -v --timeout=120
      - name: Cognitive agent and scenario contracts
        run: >-
          python3 -m pytest
          app/tests/test_cognitive_agent.py
          app/tests/test_scenario_contracts.py
          -v --timeout=120
      - name: Causal oracle tests
        run: >-
          python3 -m pytest
          app/tests/test_causal_oracle.py
          -v --timeout=120
      - name: Sample size tests
        run: >-
          python3 -m pytest
          app/tests/test_sample_size.py
          -v --timeout=120

  science-simulation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Design simulation tests
        run: >-
          python3 -m pytest
          app/tests/test_design_simulation.py
          app/tests/test_measurement_validity.py
          -v --timeout=300
      - name: Falsification suite
        run: >-
          python3 -m pytest
          app/tests/test_falsification.py
          -v --timeout=300
      - name: Simulation campaign tests
        run: >-
          python3 -m pytest
          app/tests/test_simulation_campaign.py
          -v --timeout=300
      - name: Upload simulation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-evidence
          path: backend/results/
          retention-days: 30

  science-runtime-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: E2E scientific study test
        run: >-
          python3 -m pytest
          app/tests/test_e2e_scientific_study.py
          -v --timeout=300

  science-replay-export:
    runs-on: ubuntu-latest
    defaults:
      run:
