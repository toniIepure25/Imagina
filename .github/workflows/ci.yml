name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: python3 -m ruff check .
      - name: Core and research tests (hermetic merge-gate suite)
        run: >-
          python3 -m pytest app/tests/
          -m "core or research"
          --strict-markers
          --timeout=300
          -q

  backend-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Runtime tests (migration, state machine, runtime, outbox, manifest, orchestrator, export, replay)
        run: >-
          python3 -m pytest
          app/tests/test_migration_runner.py
          app/tests/test_state_machines.py
          app/tests/test_runtime.py
          app/tests/test_outbox.py
          app/tests/test_manifest.py
          app/tests/test_synthetic_orchestrator.py
          app/tests/test_export_service.py
          app/tests/test_replay_validator.py
          app/tests/test_run_service.py
          app/tests/test_regression_gate_a.py
          -v --timeout=300

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  playwright:
    runs-on: ubuntu-latest
    needs: [backend-core, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend
      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev compose
        run: docker compose config --quiet
      - name: Validate release compose
        run: docker compose -f docker-compose.release.yml config --quiet

  docker-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start services
        run: docker compose up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          docker compose logs backend
          exit 1
      - name: Synthetic API smoke
        run: |
          curl -sf http://localhost:8000/api/synthetic-runtime/runs || true
          echo "Synthetic API accessible"
      - name: Cleanup
        if: always()
        run: docker compose down -v

  backend-legacy-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Check legacy prerequisites
        id: preflight
        run: |
          MISSING=""
          if [ ! -d "data/exports" ]; then
            MISSING="${MISSING}data/exports directory missing. "
          fi
          if [ -n "$MISSING" ]; then
            echo "status=prerequisites_missing" >> "$GITHUB_OUTPUT"
            echo "::warning::Legacy prerequisites missing: ${MISSING}"
          else
            echo "status=available" >> "$GITHUB_OUTPUT"
          fi
      - name: Legacy and artifact-dependent tests
        if: steps.preflight.outputs.status == 'available'
        run: >-
          python3 -m pytest app/tests/
          -m "artifact_dependent or legacy or external_dataset"
          --strict-markers
          --timeout=600
          -q
      - name: Report prerequisites missing
        if: steps.preflight.outputs.status == 'prerequisites_missing'
        run: |
          echo "::notice::Legacy validation skipped — prerequisites unavailable."
          echo "::notice::Run CLI pipelines to generate required artifacts (see docs/ai/SESSION_LOG.md)."
          exit 2
      - name: Report outcome
        if: always()
        run: |
          echo "::notice::Legacy/artifact validation job completed."
          echo "::notice::Preflight: ${{ steps.preflight.outputs.status }}"
