    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Replay fail-closed with sealed provenance
        run: >-
          python3 -m pytest
          app/tests/test_objective_replay.py
          app/tests/test_replay_persistent.py
          -v --timeout=120

  science-provenance-no-fallback:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: No replay defaults, no fallback, all-valid export
        run: >-
          python3 -m pytest
          app/tests/test_replay_persistent.py
          app/tests/test_objective_export.py
          -k "missing_root_seed or wrong_root_seed or unresolved_scenario
          or scenario_hash_mismatch or provider_config or rng_version
          or schedule_db_manifest or missing_previous or replay_missing_verification
          or mixed_valid_invalid or mixed_pass_fail"
          -v --timeout=120

  science-replay-export-db-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: DB-built export validated end to end, with corruption variants
        run: >-
          python3 -m pytest
          app/tests/test_replay_export_db_integration.py
          -v --timeout=120

  science-export-persistent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Export from persistent evidence
        run: >-
          python3 -m pytest
          app/tests/test_objective_export.py
          app/tests/test_objective_provenance.py
          -v --timeout=120

  science-campaign-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science]"
      - name: Campaign smoke (strict_null + medium_adaptive, 50 replicates)
        run: |
          python3 -c "
          from app.research.simulation_campaign import run_full_campaign, CORE_SCENARIOS
          scenarios = {k: CORE_SCENARIOS[k] for k in ['strict_null', 'medium_adaptive']}
          r = run_full_campaign(50, 50, 18, 42, scenarios)
          assert r.overall_pass, f'Campaign failed: {r.gate_issues}'
          sn = r.scenario_summaries['strict_null']
          assert sn.type_i_error is not None and sn.type_i_error < 0.15
          assert sn.coverage is not None and sn.coverage > 0.85
          ma = r.scenario_summaries['medium_adaptive']
          assert ma.coverage is not None and ma.coverage > 0.85
          assert ma.power is not None and ma.power > 0.80
          print('Campaign smoke OK')
          "

  science-frontend-e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -e ".[dev,science]"
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend
      - name: Run science E2E tests
        run: npx playwright test science-persistent-e2e --reporter=list
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: science-e2e-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  backend-legacy-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Check legacy prerequisites
        id: preflight
        run: |
          MISSING=""
          if [ ! -d "data/exports" ]; then
            MISSING="${MISSING}data/exports directory missing. "
          fi
          if [ -n "$MISSING" ]; then
            echo "status=prerequisites_missing" >> "$GITHUB_OUTPUT"
            echo "::warning::Legacy prerequisites missing: ${MISSING}"
          else
            echo "status=available" >> "$GITHUB_OUTPUT"
          fi
      - name: Legacy and artifact-dependent tests
        if: steps.preflight.outputs.status == 'available'
        run: >-
          python3 -m pytest app/tests/
          -m "artifact_dependent or legacy or external_dataset"
          --strict-markers
          --timeout=600
          -q
      - name: Report prerequisites missing
        if: steps.preflight.outputs.status == 'prerequisites_missing'
        run: |
          echo "::notice::Legacy validation skipped — prerequisites unavailable."
          echo "::notice::Run CLI pipelines to generate required artifacts (see docs/ai/SESSION_LOG.md)."
          exit 2
      - name: Report outcome
        if: always()
        run: |
          echo "::notice::Legacy/artifact validation job completed."
          echo "::notice::Preflight: ${{ steps.preflight.outputs.status }}"

  # --- Scientific Gate C1 (neural-behavioral alignment) ---
  # All jobs below run against tiny synthetic/deterministic fixtures
  # generated in-test (pybv-written BrainVision files, small numpy arrays)
  # -- never the real ds005815 dataset, which is not downloaded in CI.
  # Full-dataset confirmatory analysis is a separate controlled research
  # workflow (see C1_ANALYSIS_SPEC.md and run_c1_confirmatory.py), whose
  # real output is committed as the results/c1_*.json artifacts rather
  # than reproduced live in CI.

  c1-dataset-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science,neural]"
      - name: Dataset descriptor, manifest, and provenance dataclass contract
        run: >-
          python3 -m pytest
          app/tests/test_neural_registry.py
          app/tests/test_neural_yoto_adapter.py
          -v --timeout=120

  c1-download-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,science,neural]"
      - name: Download/checksum logic against mocked HTTP (no real network)
        run: >-
          python3 -m pytest
          app/tests/test_neural_download.py
          -v --timeout=60

  c1-preprocessing-determinism:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
