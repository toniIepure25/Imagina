services:
  imagina-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.release
      args:
        IMAGINA_EXTRAS: ""
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///./data/imagina.db
      - CORS_ORIGINS=http://localhost:3000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  imagina-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.release
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      imagina-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  imagina-demo-seed:
    profiles:
      - demo
    build:
      context: ./backend
      dockerfile: Dockerfile.release
    command: python -m app.cli.imagina_demo full
    volumes:
      - ./data:/app/data
    depends_on:
      imagina-backend:
        condition: service_healthy
